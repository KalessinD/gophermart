services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: gophermart
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: yp
    volumes:
      - postgres_data:/tmp/postgresql_gophermart_data

  accrual:
    container_name: go-accrual
    build:
      context: ./docker/accrual
      additional_contexts:
        bin: ./cmd/accrual
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "7081:7081"
    environment:
      DATABASE_URI: postgres://gophermart:secret@db:6432/yp?sslmode=disable
      RUN_ADDRESS: localhost:7081
      # RUN_ADDRESS: ${ACCRUAL_RUN_ADDRESS:-localhost:7081}
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
